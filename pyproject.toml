[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "face-watch-prototype"
version = "0.1.0"
description = "Local video face watchlist prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.8",
  "httpx==0.28.1",
  "imageio-ffmpeg==0.6.0",
  "jinja2==3.1.6",
  "numpy==2.3.5",
  "opencv-python-headless==4.13.0.92",
  "python-multipart==0.0.20",
  "uvicorn==0.39.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
]
validation = [
  "onnxruntime==1.30.0",
]

[project.scripts]
face-watch = "face_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: exercises real OpenCV models and video decoding",
]
